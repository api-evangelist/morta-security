name: Morta Security
description: >-
  Morta Security was a stealth-mode cybersecurity startup founded in 2012 by a
  team with backgrounds in threat intelligence and protecting national critical
  infrastructure (widely reported as ex-NSA engineers). The company was building
  a new paradigm for detecting and countering advanced, targeted cyber threats.
  Morta raised roughly $1.9M in venture funding from Andreessen Horowitz (a16z),
  DCVC (Data Collective), Greylock, Norwest, and Wing Venture Capital, and was
  acquired by Palo Alto Networks (NYSE: PANW) in 2013-2014, where its technology
  and team were folded into Palo Alto's threat-detection products. Morta Security
  no longer operates as an independent company and publishes no live website,
  developer portal, or API surface. This profile is retained in the API Evangelist
  network as a historical VC-portfolio record; enrichment found no API artifacts.
